<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amelia Dudek - Indiana Learner's Permit Practice Exam</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .container {
        background: white;
        width: 90%;
        max-width: 750px;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
        text-align: center;
        font-size: 22px;
    }
    .question {
        font-size: 18px;
        margin-bottom: 20px;
    }
    .answers button {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
        cursor: pointer;
        font-size: 14px;
    }
    .answers button:hover {
        background-color: #e6e6e6;
    }
    .feedback {
        margin-top: 15px;
        font-size: 14px;
        min-height: 40px;
    }
    .progress {
        margin-bottom: 15px;
        font-size: 14px;
        text-align: right;
        color: #555;
    }
    .correct { color: green; }
    .incorrect { color: red; }
    .complete { text-align: center; }
    .results { margin-top: 20px; font-size: 14px; }
    .reset-btn {
        margin-top: 20px;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        background-color: #333;
        color: white;
        cursor: pointer;
    }
    .reset-btn:hover {
        background-color: #555;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Indiana Permit Practice Exam<br>Custom for Amelia Dudek</h1>
    <div class="progress" id="progress"></div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
</div>

<script>
const questions = [
{
q: "1. What does a diamond-shaped road sign indicate?",
a: ["Stop", "Warning", "Yield", "Railroad Crossing"],
correct: 1,
explanation: "Diamond-shaped signs are warning signs. They alert drivers to upcoming hazards."
},
{
q: "2. When approaching a stopped school bus with flashing red lights, you must:",
a: ["Slow and pass carefully", "Stop regardless of direction (unless divided highway)", "Honk before passing", "Continue if no children visible"],
correct: 1,
explanation: "Indiana law requires you to stop for a school bus with flashing red lights unless separated by a physical median."
},
{
q: "3. You must signal at least how many feet before turning?",
a: ["50 feet", "100 feet", "200 feet", "500 feet"],
correct: 2,
explanation: "Drivers must signal at least 200 feet before turning."
},
{
q: "4. A steady red traffic light means:",
a: ["Stop and remain stopped", "Stop then proceed when clear", "Yield", "Slow and proceed"],
correct: 0,
explanation: "A steady red light means come to a complete stop and wait."
},
{
q: "5. If your vehicle begins to skid, you should:",
a: ["Brake hard", "Turn into the skid", "Accelerate", "Shift to neutral"],
correct: 1,
explanation: "Steer in the direction of the skid to regain control."
}
];

let current = 0;
let firstAttempts = [];
let correctFirstTry = 0;
let attempted = false;

function loadQuestion() {
    if (current >= questions.length) {
        showResults();
        return;
    }

    attempted = false;
    document.getElementById("progress").innerText =
        "Question " + (current + 1) + " of " + questions.length;

    document.getElementById("question").innerText = questions[current].q;
    document.getElementById("feedback").innerText = "";
    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    questions[current].a.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.innerText = answer;
        btn.onclick = () => checkAnswer(index);
        answersDiv.appendChild(btn);
    });
}

function checkAnswer(index) {
    const feedback = document.getElementById("feedback");

    if (!attempted) {
        firstAttempts[current] = index;
        if (index === questions[current].correct) {
            correctFirstTry++;
        }
        attempted = true;
    }

    if (index === questions[current].correct) {
        feedback.innerHTML = "<span class='correct'>Correct! ✔<br>" +
            questions[current].explanation + "</span>";
        setTimeout(() => {
            current++;
            loadQuestion();
        }, 2000);
    } else {
        feedback.innerHTML = "<span class='incorrect'>Incorrect. Try again.</span>";
    }
}

function showResults() {
    const container = document.querySelector(".container");
    const percentage = Math.round((correctFirstTry / questions.length) * 100);

    container.innerHTML = `
        <div class="complete">
            <h2>Test Complete, Amelia! 🎉</h2>
            <div class="results">
                <p><strong>Total Questions:</strong> ${questions.length}</p>
                <p><strong>Correct on First Attempt:</strong> ${correctFirstTry}</p>
                <p><strong>First-Attempt Score:</strong> ${percentage}%</p>
            </div>
            <button class="reset-btn" onclick="resetTest()">Reset Test</button>
        </div>
    `;
}

function resetTest() {
    current = 0;
    firstAttempts = [];
    correctFirstTry = 0;
    attempted = false;

    document.querySelector(".container").innerHTML = `
        <h1>Indiana Permit Practice Exam<br>Custom for Amelia Dudek</h1>
        <div class="progress" id="progress"></div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
    `;

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
